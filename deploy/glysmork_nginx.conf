server {
    server_name api.glysmork.com;
    client_max_body_size 10M;

    location /media/ {
        alias /home/ubuntu/glysmork/media/;
        expires 30d;
        add_header Cache-Control public;
    }

    location /static/ {
        alias /home/ubuntu/glysmork/static/;
        expires 30d;
        add_header Cache-Control public;
    }

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }

    location /onboarding/ {
        proxy_pass http://localhost:8081/onboarding/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.glysmork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.glysmork.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = api.glysmork.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name api.glysmork.com;
    return 404;
}
